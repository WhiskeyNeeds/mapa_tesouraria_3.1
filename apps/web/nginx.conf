# Marca user-agents conhecidos de bots/crawlers para nao logar
map $http_user_agent $not_bot {
    default                                              1;
    "~*bot|crawl|spider|scraper|httpx|wget|fetcher"      0;
}

# Marca status codes ruidosos (304 not modified, 404 not found)
map $status $not_noise {
    default   1;
    304       0;
    404       0;
}

# Combina: so logar se nao for bot E nao for status ruidoso
map "$not_bot$not_noise" $loggable {
    "11"      1;
    default   0;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log combined if=$loggable;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Long cache for fingerprinted Vite assets — silencioso
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # Favicons e robots.txt — silenciosos (pedidos demasiado frequentes para interessarem)
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # SPA fallback — never cache index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
